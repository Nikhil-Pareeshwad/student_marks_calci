<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Mark Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-card">
    <h2>Student Mark Calculator</h2>
    <p class="subtitle">Enter marks out of 100 for each subject</p>

    <form id="markForm" novalidate>
      <div id="subjectInputs">
        <div class="subject-row">
          <label for="sub1">Subject 1:</label>
          <input type="number" id="sub1" class="mark-input" step="any" placeholder="0 - 100">
        </div>
        <div class="subject-row">
          <label for="sub2">Subject 2:</label>
          <input type="number" id="sub2" class="mark-input" step="any" placeholder="0 - 100">
        </div>
        <div class="subject-row">
          <label for="sub3">Subject 3:</label>
          <input type="number" id="sub3" class="mark-input" step="any" placeholder="0 - 100">
        </div>
      </div>

      <!-- Error Message Box -->
      <div id="errorMessage" class="error-box hidden"></div>

      <button type="button" id="calculateBtn">Calculate Marks</button>
    </form>

    <!-- Results Display -->
    <div id="results" class="results-card hidden">
      <h3>Results Summary</h3>
      <p><strong>Total Marks:</strong> <span id="totalMarks">0</span> / 300</p>
      <p><strong>Percentage:</strong> <span id="percentage">0</span>%</p>
      <p><strong>Status:</strong> <span id="passFailStatus" class="status"></span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
